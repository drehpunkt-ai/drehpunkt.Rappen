# Wöchentliche Prüfung mit Trivy (drehpunkt.Plattform, ARCHITEKTUR.md, Kapitel 9, Lieferkette): alle Images aus den
# Compose-Dateien per Digest, auch die eigenen, und das Repo (Lockfiles, Dockerfiles, Infrastruktur-Code). Ergebnis
# in der Zusammenfassung des Laufs und als Artefakt trivy-ergebnis.json (für den Versions-Exporter, Kapitel 8). Rot bei
# kritischen Funden mit Korrektur oder einem Image, das sich nicht prüfen lässt. Trivy als Binary mit fester
# Prüfsumme statt der Action (Angriff vom März 2026). Dieselbe Datei in jedem Repo mit Code, nur die Zeit im Zeitplan
# unterscheidet sich. Original in drehpunkt.Plattform, Änderungen dort und danach in die anderen Repos kopieren.
name: Trivy
on:
  schedule:
    - cron: "57 4 * * 1"
  workflow_dispatch:
  push:
    paths: ["**/compose.yaml", "**/pnpm-lock.yaml", "**/Dockerfile", "**/Containerfile", ".trivyignore.yaml", "werkzeuge/trivy-pruefen.py", ".github/workflows/trivy.yml"]
permissions:
  contents: read
  packages: read
concurrency:
  group: trivy
  cancel-in-progress: true
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      TRIVY_SKIP_VERSION_CHECK: "true"
      TRIVY_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy und PyYAML
        run: |
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          rm trivy.tar.gz
          sudo apt-get install -y --no-install-recommends python3-yaml
      # Nur bei ghcr.io anmelden, nicht über TRIVY_PASSWORD: das ginge an jede Registry
      - name: Anmeldung bei der Registry von GitHub (nur lesen)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Prüfen
        run: python3 -I werkzeuge/trivy-pruefen.py
      - name: Ergebnis aufbewahren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-ergebnis
          path: trivy-ergebnis.json
          retention-days: 90
          if-no-files-found: ignore
